name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: hashFiles('tests/**/*.csproj') != ''
        run: >
          dotnet test --no-build --configuration Release
          --report-trx --results-directory TestResults
          --coverage --coverage-output-format cobertura

      - name: Upload test results
        if: always() && hashFiles('TestResults/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults



  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait postgres && docker compose up -d --build ledgerly

      - name: Exercise the REST API (JSON transcoding)
        run: |
          for i in $(seq 1 40); do curl -fs http://localhost:8080/health && break; sleep 2; done
          a=$(curl -fs -X POST http://localhost:8080/v1/accounts -H 'Content-Type: application/json' \
                -d '{"owner":"Alice","currency":"EUR"}' | jq -r .accountId)
          b=$(curl -fs -X POST http://localhost:8080/v1/accounts -H 'Content-Type: application/json' \
                -d '{"owner":"Bob","currency":"EUR"}' | jq -r .accountId)
          curl -fs -X POST "http://localhost:8080/v1/accounts/$a/deposits" -H 'Content-Type: application/json' \
               -d '{"amount":"100.00","reference":"salary"}' > /dev/null
          curl -fs -X POST http://localhost:8080/v1/transfers -H 'Content-Type: application/json' \
               -d "{\"idempotencyKey\":\"ci-1\",\"fromAccountId\":\"$a\",\"toAccountId\":\"$b\",\"amount\":\"30\",\"reference\":\"test\"}" > /dev/null
          test "$(curl -fs http://localhost:8080/v1/accounts/$a | jq -r .balance)" = "70.00"
          test "$(curl -fs http://localhost:8080/v1/accounts/$b | jq -r .balance)" = "30.00"
          echo "Transfer through the container works"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs ledgerly
