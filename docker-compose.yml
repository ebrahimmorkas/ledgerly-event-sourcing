services:
  ledgerly:
    build:
      context: .
      dockerfile: src/Ledgerly.Api/Dockerfile
    image: ledgerly:local
    container_name: ledgerly
    environment:
      ConnectionStrings__Ledger: Host=postgres;Port=5432;Database=ledgerly;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: ledgerly-postgres
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ledgerly-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerly-data:
